# Servicios (mismo orden en ambos idiomas)
servicios:
  - codigo: WP
    es: { titulo: WordPress a medida, texto: "Temas y bloques propios, sin constructores pesados. Membresías, multilingüe y migraciones." }
    en: { titulo: Custom WordPress, texto: "Our own themes and blocks, no heavy page builders. Memberships, multilingual sites and migrations." }
  - codigo: OJS
    es: { titulo: Revistas científicas OJS/PKP, texto: "Instalación, actualización, temas e indexación de revistas académicas en Open Journal Systems." }
    en: { titulo: Scientific journals on OJS/PKP, texto: "Installation, upgrades, theming and indexing for academic journals on Open Journal Systems." }
  - codigo: SHOP
    es: { titulo: E-commerce y cursos, texto: "Tiendas WooCommerce y plataformas de cursos grabados con pagos en Chile y el extranjero." }
    en: { titulo: E-commerce and courses, texto: "WooCommerce stores and recorded-course platforms with payments in Chile and abroad." }
  - codigo: FAST
    es: { titulo: Sitios estáticos rápidos, texto: "Jekyll y GitHub Pages: sin servidor que mantener, seguros y con carga casi instantánea." }
    en: { titulo: Fast static sites, texto: "Jekyll and GitHub Pages: no server to maintain, secure and nearly instant to load." }
  - codigo: 3D
    es: { titulo: Visualización 3D web, texto: "Configuradores y visores con Three.js que corren en cualquier navegador, también en el celular." }
    en: { titulo: Web 3D visualization, texto: "Configurators and viewers built with Three.js that run in any browser, including phones." }

proceso:
  - es: { titulo: Conversación, texto: "Entendemos qué necesitas y qué existe hoy." }
    en: { titulo: Conversation, texto: "We learn what you need and what exists today." }
