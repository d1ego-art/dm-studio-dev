{%- assign s = site.data.sitio -%}
<footer class="site-footer">
  <div class="footer-grid">
    <div>
      <img src="{{ '/assets/img/marca/logo-192.webp' | relative_url }}" alt="DM Studio" width="48" height="48" loading="lazy">
      <p class="mono muted small">DMSTUDIO.DEV · {{ t.footer }}</p>
    </div>
    <div>
      <h2 class="eyebrow">{{ t.nav_equipo }}</h2>
      {%- for p in s.equipo %}
      <a href="https://github.com/{{ p.github }}" target="_blank" rel="noopener">github.com/{{ p.github }}</a>
      {%- endfor %}
      {%- if s.email != "" %}<a href="mailto:{{ s.email }}">{{ s.email }}</a>{% endif %}
    </div>
    <div class="sibling">
      <h2 class="eyebrow">{{ t.hermano }}</h2>
      <a href="{{ s.cl_url }}" target="_blank" rel="noopener" class="sibling-link">
        <span class="mono">dmstudio<b>.cl</b></span>
        <small>{{ t.hermano_texto }}</small>
      </a>
    </div>
  </div>
  <p class="mono muted small">© {{ 'now' | date: '%Y' }} DM Studio.</p>
</footer>
