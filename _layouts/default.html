{%- assign lang = page.lang | default: site.lang -%}
{%- assign t = site.data.i18n[lang] -%}
<!doctype html>
<html lang="{{ lang }}">
<head>
{% include head.html %}
</head>
<body class="{{ page.body_class }}">
  <a class="skip" href="#main">{{ t.skip }}</a>
  {% include header.html %}
  <main id="main">
    {{ content }}
  </main>
  {% include footer.html %}
  <script type="module" src="{{ '/assets/js/main.js' | relative_url }}"></script>
</body>
</html>
